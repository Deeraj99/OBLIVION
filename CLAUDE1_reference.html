<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Exam Papers &amp; Deadlines for Teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --ink:#16302B;
    --ink-soft:#2A433D;
    --paper:#ECEFE9;
    --surface:#FBFAF5;
    --line:#D8D9CE;
    --muted:#5B6660;
    --accent:#C98A2B;
    --accent-ink:#2A1B04;
    --accent-soft:#F3E3C4;
    --red:#B23B34;
    --red-soft:#F3DCDA;
    --sage:#5C7A5E;
    --sage-soft:#DEE7DD;
    --radius:7px;
    --shadow:0 1px 2px rgba(22,48,43,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Newsreader',serif;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  a{color:var(--ink);}

  #app{display:flex;min-height:100vh;}
  .hidden{display:none !important;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px;flex:none;background:var(--ink);color:var(--paper);
    display:flex;flex-direction:column;padding:22px 14px;gap:6px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 22px;}
  .brand .mark{font-family:'Newsreader',serif;font-style:italic;font-size:22px;color:var(--accent);}
  .brand .word{font-family:'Newsreader',serif;font-size:19px;letter-spacing:.2px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);
    color:#CBD6CE;cursor:pointer;font-size:14px;font-weight:500;border:1px solid transparent;
  }
  .navitem svg{width:17px;height:17px;flex:none;opacity:.85;}
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
  .navitem.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.08);}
  .sidebar-foot{margin-top:auto;padding:10px 10px 2px;font-size:12px;color:#8FA098;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
  .sidebar-foot .who{color:#E4E9DE;font-weight:600;margin-bottom:2px;}
  .lock-link{cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .topbar{
    padding:20px 32px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;flex:none;background:var(--paper);
  }
  .topbar h1{margin:0;font-size:22px;font-weight:500;}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .content{flex:1;overflow-y:auto;padding:26px 32px 60px;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);padding:9px 15px;border-radius:var(--radius);cursor:pointer;font-size:13.5px;font-weight:600;
    transition:background .12s, border-color .12s;
  }
  .btn:hover{border-color:var(--ink);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:rgba(0,0,0,.05);}
  .btn-danger{color:var(--red);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .icon-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);}
  .icon-btn:hover{background:rgba(0,0,0,.06);color:var(--ink);}
  .icon-btn svg{width:15px;height:15px;}

  input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
    color:var(--ink);font-family:inherit;font-size:13.5px;
  }
  textarea{resize:vertical;min-height:64px;}
  label.field-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;letter-spacing:.1px;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:14px;}
  .row > .field{flex:1;min-width:0;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px;}
  .panel h2{margin:0 0 4px;font-size:17px;font-weight:500;}
  .panel .panel-hint{color:var(--muted);font-size:12.5px;margin:0 0 16px;}

  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  .stat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;}
  .stat .n{font-family:'Newsreader',serif;font-size:28px;line-height:1;}
  .stat .l{color:var(--muted);font-size:12px;margin-top:6px;}
  .stat.overdue .n{color:var(--red);}
  .stat.today .n{color:var(--accent-ink);}
  .stat.soon .n{color:var(--accent-ink);}

  .ledger{border-top:1px solid var(--line);}
  .ledger-row{
    display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .ledger-row:hover{background:rgba(0,0,0,.015);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.high{background:var(--red);}
  .dot.medium{background:var(--accent);}
  .dot.low{background:var(--sage);}
  .lr-main{flex:1;min-width:0;}
  .lr-title{font-weight:600;font-size:14px;}
  .lr-meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .lr-date{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .lr-date.overdue{color:var(--red);font-weight:600;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.high{background:var(--red-soft);color:var(--red);}
  .pill.medium{background:var(--accent-soft);color:var(--accent-ink);}
  .pill.low{background:var(--sage-soft);color:var(--sage);}
  .pill.status{background:#E7E9E1;color:var(--muted);}

  .empty{padding:34px 10px;text-align:center;color:var(--muted);}
  .empty .serif{font-size:18px;color:var(--ink);display:block;margin-bottom:6px;}

  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start;}

  .banner{
    display:flex;align-items:flex-start;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);
    border-radius:10px;padding:13px 15px;margin-bottom:20px;font-size:13.5px;color:var(--accent-ink);
  }
  .banner b{font-weight:700;}
  .banner-list{margin:6px 0 0;padding-left:18px;}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(22,48,43,.4);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal{
    background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
    padding:26px 26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal.wide{max-width:920px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .modal-head h2{margin:0;font-size:19px;font-weight:500;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}

  .checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .check-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;cursor:pointer;background:var(--surface);}
  .check-item input{width:auto;}
  .check-item.on{border-color:var(--accent);background:var(--accent-soft);}

  .chapter-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .chapter-row input[type=text]{flex:2;}
  .chapter-row input[type=number]{flex:1;}

  .slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .slider-row label{width:70px;font-size:12.5px;color:var(--muted);font-weight:600;}
  .slider-row input[type=range]{flex:1;accent-color:var(--accent);}
  .slider-row .val{width:40px;text-align:right;font-size:13px;font-weight:600;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .tab{padding:9px 4px;margin-right:18px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-color:var(--accent);}

  .wizard-steps{display:flex;gap:0;margin-bottom:22px;}
  .wstep{flex:1;text-align:center;padding-bottom:10px;border-bottom:3px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;position:relative;}
  .wstep.active{color:var(--ink);border-color:var(--accent);}
  .wstep.done{color:var(--ink);border-color:var(--sage);}

  .qcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--surface);}
  .qcard .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .qtag{font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--muted);}
  .qcard textarea{margin-bottom:8px;}
  .qmeta-row{display:flex;gap:8px;}
  .qmeta-row > *{flex:1;}
  .answer-toggle{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;margin-top:6px;display:inline-block;}

  .valid-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
  .valid-item:last-child{border-bottom:none;}
  .valid-icon{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px;}
  .valid-icon.ok{background:var(--sage);}
  .valid-icon.bad{background:var(--red);}
  .valid-title{font-weight:600;font-size:13.5px;}
  .valid-detail{color:var(--muted);font-size:12.5px;margin-top:2px;}

  /* Exam preview / print sheet */
  .sheet{background:#fff;border:1px solid var(--line);padding:44px 48px;font-family:'Newsreader',serif;color:#111;max-width:760px;margin:0 auto;}
  .sheet h1{font-size:22px;text-align:center;margin:0 0 2px;}
  .sheet .meta-line{text-align:center;font-size:13px;color:#333;margin-bottom:4px;font-family:'Work Sans',sans-serif;}
  .sheet hr{border:none;border-top:1px solid #999;margin:14px 0;}
  .sheet .instructions{font-family:'Work Sans',sans-serif;font-size:12.5px;background:#f4f4ef;border:1px solid #ccc;padding:10px 14px;margin-bottom:18px;}
  .sheet .section-h{font-weight:600;font-size:15px;margin:22px 0 10px;}
  .sheet .q{margin-bottom:14px;font-size:14px;}
  .sheet .q .qn{font-weight:600;}
  .sheet .q .marks{float:right;font-family:'Work Sans',sans-serif;font-size:12px;color:#444;}

  /* Calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .cal-dow{background:var(--ink);color:var(--paper);text-align:center;padding:7px 0;font-size:11.5px;font-weight:600;}
  .cal-cell{background:var(--surface);min-height:88px;padding:6px 7px;cursor:pointer;}
  .cal-cell:hover{background:#fff;}
  .cal-cell.dim{background:#EEEEE6;color:var(--muted);}
  .cal-cell.today{outline:2px solid var(--accent);outline-offset:-2px;}
  .cal-daynum{font-size:12px;font-weight:600;margin-bottom:5px;}
  .cal-dots{display:flex;flex-wrap:wrap;gap:3px;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:320px;}
  .toast.err{background:var(--red);}
  .toast.ok{background:var(--sage);}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
  .spin.dark{border:2px solid rgba(22,48,43,.25);border-top-color:var(--ink);}
  @keyframes sp{to{transform:rotate(360deg);}}

  .upload-box{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;}
  .upload-box:hover{border-color:var(--accent);}
  .analysis-box{background:var(--sage-soft);border:1px solid var(--sage);border-radius:8px;padding:12px 14px;font-size:12.5px;margin-top:12px;}

  @media print{
    .sidebar,.topbar,.no-print{display:none !important;}
    .content{overflow:visible;padding:0;}
    .sheet{border:none;padding:0;max-width:none;}
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   LEDGER — Teacher Toolkit
   Two features: AI Exam Paper Creator + Deadline Reminder System
   Persistence: window.storage (per-teacher, private)
   AI: Claude API called client-side (no key handling needed)
   ============================================================ */

const CLAUDE_MODEL = "claude-sonnet-4-6";

/* ---------------- State ---------------- */
const state = {
  profile: null,          // {name, school, pin}
  unlocked: false,
  deadlines: [],          // array
  papers: [],             // array
  view: "dashboard",
  calMonth: (()=>{const d=new Date();d.setDate(1);return d;})(),
  draft: null,            // exam paper currently being built
  wizardStep: 1,
  editingDeadlineId: null,
  calSelectedDate: null,
  suggestTopicResults: [],
};

/* ---------------- Storage helpers ---------------- */
async function storeGet(key){
  try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storeSet(key,val){
  try{ await window.storage.set(key, JSON.stringify(val), false); }
  catch(e){ toast("Couldn't save "+key+" — changes may not persist.","err"); }
}

async function loadAll(){
  state.profile = await storeGet('teacherProfile');
  state.deadlines = (await storeGet('deadlines')) || [];
  state.papers = (await storeGet('examPapers')) || [];
}
function saveDeadlines(){ storeSet('deadlines', state.deadlines); }
function savePapers(){ storeSet('examPapers', state.papers); }
function saveProfile(){ storeSet('teacherProfile', state.profile); }

/* ---------------- Utils ---------------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function daysUntil(iso){
  const today = new Date(todayISO()+"T00:00:00");
  const d = new Date(iso+"T00:00:00");
  return Math.round((d-today)/86400000);
}
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast'+(type?' '+type:'');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function stripFence(s){
  return s.replace(/^```[a-zA-Z]*\n?/,'').replace(/```$/,'').trim();
}

/* ---------------- Claude API ---------------- */
async function claudeCall(system, userContent, maxTokens){
  const body = {
    model: CLAUDE_MODEL,
    max_tokens: maxTokens || 2000,
    system: system,
    messages: [{ role:"user", content:userContent }]
  };
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if(!res.ok){ throw new Error("AI request failed ("+res.status+")"); }
  const data = await res.json();
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  if(!textBlock) throw new Error("No response from AI.");
  return textBlock.text;
}
async function claudeJSON(system, userText, maxTokens){
  const raw = await claudeCall(system, userText, maxTokens);
  const cleaned = stripFence(raw);
  try{ return JSON.parse(cleaned); }
  catch(e){
    const m = cleaned.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
    if(m){ try{ return JSON.parse(m[1]); }catch(e2){} }
    throw new Error("AI returned an unexpected format. Please try again.");
  }
}

/* ---------------- File -> base64 / text ---------------- */
function readFileAsBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(",")[1]);
    r.onerror = ()=>rej(new Error("Couldn't read file"));
    r.readAsDataURL(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error("Couldn't read file"));
    r.readAsArrayBuffer(file);
  });
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!state.profile){ app.innerHTML = renderSetup(); attachSetupEvents(); return; }
  if(state.profile.pin && !state.unlocked){ app.innerHTML = renderLock(); attachLockEvents(); return; }

  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${renderTopbar()}
      <div class="content" id="content">${renderView()}</div>
    </div>
    ${renderModals()}
  `;
  attachGlobalEvents();
}

/* ---------------- Setup / lock screens ---------------- */
function renderSetup(){
  return `
  <div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);">
    <div class="panel" style="max-width:420px;width:100%;">
      <div class="brand" style="padding:0 0 18px;">
        <span class="mark">L</span><span class="word" style="color:var(--ink);">Ledger</span>
      </div>
      <h2>Set up your workspace</h2>
      <p class="panel-hint">This toolkit is for teachers only — no student accounts exist here. Your papers and deadlines stay private to you.</p>
      <div class="field"><label class="field-label">Your name</label><input type="text" id="setupName" placeholder="e.g. Ms. Anjali Rao"></div>
      <div class="field"><label class="field-label">School (optional)</label><input type="text" id="setupSchool" placeholder="e.g. Greenwood High School"></div>
      <div class="field"><label class="field-label">4-digit PIN (optional — protects this device)</label><input type="text" id="setupPin" maxlength="4" placeholder="Leave blank to skip"></div>
      <button class="btn btn-primary" id="setupSave" style="width:100%;justify-content:center;margin-top:6px;">Enter workspace</button>
    </div>
  </div>`;
}
function attachSetupEvents(){
  document.getElementById('setupSave').onclick = async ()=>{
    const name = document.getElementById('setupName').value.trim();
    if(!name){ toast("Please enter your name.","err"); return; }
    const school = document.getElementById('setupSchool').value.trim();
    const pin = document.getElementById('setupPin').value.trim();
    state.profile = { name, school, pin: pin || null };
    state.unlocked = true;
    await saveProfile();
    render();
  };
}
function renderLock(){
  return `
  <div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);">
    <div class="panel" style="max-width:340px;width:100%;text-align:center;">
      <div class="brand" style="padding:0 0 18px;justify-content:center;">
        <span class="mark">L</span><span class="word" style="color:var(--ink);">Ledger</span>
      </div>
      <p class="panel-hint">Welcome back, ${esc(state.profile.name)}. Enter your PIN to continue.</p>
      <input type="password" id="lockPin" maxlength="4" style="text-align:center;letter-spacing:6px;font-size:18px;">
      <button class="btn btn-primary" id="lockGo" style="width:100%;justify-content:center;margin-top:12px;">Unlock</button>
      <div style="margin-top:14px;"><span class="lock-link" id="forgotPin" style="font-size:12px;color:var(--muted);">Reset workspace</span></div>
    </div>
  </div>`;
}
function attachLockEvents(){
  const go = ()=>{
    const v = document.getElementById('lockPin').value.trim();
    if(v === state.profile.pin){ state.unlocked = true; render(); }
    else toast("Incorrect PIN","err");
  };
  document.getElementById('lockGo').onclick = go;
  document.getElementById('lockPin').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  document.getElementById('forgotPin').onclick = async ()=>{
    if(confirm("This clears your PIN so you can get back in. Your papers and deadlines stay intact. Continue?")){
      state.profile.pin = null; state.unlocked = true; await saveProfile(); render();
    }
  };
}

/* ---------------- Sidebar / Topbar ---------------- */

function bucketDeadlines(){
  const b = {overdue:[], today:[], soon:[], upcoming:[], completed:[]};
  state.deadlines.forEach(d=>{
    if(d.status==='Completed'){ b.completed.push(d); return; }
    const n = daysUntil(d.date);
    if(n<0) b.overdue.push(d);
    else if(n===0) b.today.push(d);
    else if(n<=3) b.soon.push(d);
    else b.upcoming.push(d);
  });
  const byDate = (a,c)=> a.date===c.date ? 0 : (a.date<c.date?-1:1);
  Object.values(b).forEach(arr=>arr.sort(byDate));
  return b;
}
function activeReminders(){
  const out = [];
  state.deadlines.forEach(d=>{
    if(d.status==='Completed') return;
    const n = daysUntil(d.date);
    const rd = d.reminderDays || [7,3,1,0];
    if(rd.includes(n) && n>=0) out.push({d,n});
  });
  return out.sort((a,c)=>a.n-c.n);
}

function renderCalendar(){
  const m = state.calMonth;
  const year = m.getFullYear(), month = m.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({n:prevDays-startOffset+1+i, dim:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({n:d, dim:false, date:`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length%7!==0 || cells.length<42) cells.push({n:cells.length, dim:true});

  const byDate = {};
  state.deadlines.forEach(d=>{ (byDate[d.date] = byDate[d.date]||[]).push(d); });
  const monthLabel = m.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  return `
  <div class="panel">
    <div class="cal-head">
      <button class="icon-btn" id="calPrev">‹</button>
      <h2 style="margin:0;">${monthLabel}</h2>
      <button class="icon-btn" id="calNext">›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        if(c.dim) return `<div class="cal-cell dim"><div class="cal-daynum">${c.n}</div></div>`;
        const items = byDate[c.date]||[];
        const isToday = c.date===todayISO();
        return `<div class="cal-cell ${isToday?'today':''}" data-cal-day="${c.date}">
          <div class="cal-daynum">${c.n}</div>
          <div class="cal-dots">${items.slice(0,6).map(d=>`<span class="dot ${d.priority.toLowerCase()}" title="${esc(d.title)}"></span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ---- Step 3: Validate ---- */
function normWords(s){ return new Set((s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean)); }
function jaccard(a,b){ const A=normWords(a),B=normWords(b); if(!A.size||!B.size) return 0; let inter=0; A.forEach(w=>{if(B.has(w))inter++;}); return inter/(A.size+B.size-inter); }

function validatePaper(d){
  const items = [];
  const s = d.setup;
  const sumMarks = d.questions.reduce((a,q)=>a+Number(q.marks||0),0);
  items.push({ok: sumMarks===Number(s.totalMarks), title:'Total marks', detail:`${sumMarks} of ${s.totalMarks} target marks used.`});
  items.push({ok: d.questions.length===Number(s.numQuestions), title:'Number of questions', detail:`${d.questions.length} of ${s.numQuestions} target questions added.`});

  s.chapters.forEach(c=>{
    const got = d.questions.filter(q=>q.chapter===c.name).reduce((a,q)=>a+Number(q.marks||0),0);
    items.push({ok: got===Number(c.marks), title:`${c.name} marks`, detail:`${got} of ${c.marks} target marks.`});
  });

  const missing = s.chapters.filter(c=>!d.questions.some(q=>q.chapter===c.name));
  items.push({ok: missing.length===0, title:'Topic coverage', detail: missing.length? `No questions yet for: ${missing.map(c=>c.name).join(', ')}.` : 'Every chapter has at least one question.'});

  const total = d.questions.length||1;
  const counts = {Easy:0,Medium:0,Hard:0};
  d.questions.forEach(q=>counts[q.difficulty]=(counts[q.difficulty]||0)+1);
  const pct = k=>Math.round((counts[k]||0)/total*100);
  const diffOk = Math.abs(pct('Easy')-s.difficulty.easy)<=15 && Math.abs(pct('Medium')-s.difficulty.medium)<=15 && Math.abs(pct('Hard')-s.difficulty.hard)<=15;
  items.push({ok: diffOk, title:'Difficulty distribution', detail:`Actual — Easy ${pct('Easy')}%, Medium ${pct('Medium')}%, Hard ${pct('Hard')}% (target Easy ${s.difficulty.easy}%, Medium ${s.difficulty.medium}%, Hard ${s.difficulty.hard}%).`});

  const usedTypes = new Set(d.questions.map(q=>q.type));
  const unusedAllowed = s.types.filter(t=>!usedTypes.has(t));
  items.push({ok: unusedAllowed.length<=1, title:'Question type variety', detail: unusedAllowed.length? `Not yet used: ${unusedAllowed.join(', ')}.` : 'Good mix of allowed question types.'});

  let dupFound = [];
  for(let i=0;i<d.questions.length;i++) for(let j=i+1;j<d.questions.length;j++){
    if(jaccard(d.questions[i].question, d.questions[j].question) > 0.55) dupFound.push([i+1,j+1]);
  }
  items.push({ok: dupFound.length===0, title:'Duplicate questions', detail: dupFound.length? `Questions ${dupFound.map(p=>p.join(' & ')).join(', ')} look very similar.` : 'No near-duplicate questions found.'});

  let simFlag = false;
  if(d.analysis && d.analysis.rawText){
    const prevWords = normWords(d.analysis.rawText.slice(0,4000));
    simFlag = d.questions.some(q=>{
      const words = (q.question||'').toLowerCase().split(/\s+/);
      for(let i=0;i+7<words.length;i++){
        const gram = words.slice(i,i+8).join(' ');
        if(d.analysis.rawText.toLowerCase().includes(gram)) return true;
      }
      return false;
    });
  }
  items.push({ok: !simFlag, title:'Similarity to previous paper', detail: simFlag? 'One or more questions closely match text from the uploaded previous paper — please rephrase.' : (d.analysis? 'No close text overlap with the uploaded previous paper.' : 'No previous paper was uploaded for comparison.')});

  const estMinutes = d.questions.reduce((a,q)=> a + (MIN_PER_MARK[q.type]||2)*Number(q.marks||0), 0);
  const durOk = Math.abs(estMinutes - s.duration) <= s.duration*0.25;
  items.push({ok: durOk, title:'Duration check', detail:`Estimated time to complete: ~${Math.round(estMinutes)} min vs a ${s.duration} min exam.`});

  return items;
}
function renderStepValidate(){
  const items = validatePaper(state.draft);
  const allOk = items.every(i=>i.ok);
  return `

    <p class="panel-hint">You're always in control — nothing here blocks you from exporting.</p>

async function analyzePreviousPaper(file){
  const name = file.name.toLowerCase();
  const system = "You analyze exam-paper documents for a teacher tool. Respond with ONLY valid JSON, no markdown, matching: {\"summary\":string,\"sections\":[string],\"questionTypesFound\":[string],\"markDistributionNotes\":string,\"difficultyEstimateNotes\":string,\"topicsCovered\":[string],\"styleNotes\":string,\"instructionsText\":string}";
  let userContent, rawTextForSimilarity = '';

  if(name.endsWith('.docx')){
    const buf = await readFileAsArrayBuffer(file);
    const result = await mammoth.extractRawText({arrayBuffer: buf});
    rawTextForSimilarity = result.value || '';
    userContent = [{type:'text', text: "Here is the extracted text of a previous exam paper:\n\n" + rawTextForSimilarity.slice(0,12000) + "\n\nAnalyze it per the schema."}];
  } else if(name.endsWith('.pdf')){
    const b64 = await readFileAsBase64(file);
    userContent = [
      {type:'document', source:{type:'base64', media_type:'application/pdf', data:b64}},
      {type:'text', text:'Analyze this exam paper per the schema.'}
    ];
  } else {
    const b64 = await readFileAsBase64(file);
    const mt = file.type || 'image/png';
    userContent = [
      {type:'image', source:{type:'base64', media_type:mt, data:b64}},
      {type:'text', text:'Analyze this exam paper per the schema.'}
    ];
  }
  const parsed = await claudeJSON(system, userContent, 1500);
  parsed.rawText = rawTextForSimilarity;
  return parsed;
}

function persistDraft(){
  const idx = state.papers.findIndex(p=>p.id===state.draft.id);
  const toSave = JSON.parse(JSON.stringify(state.draft));
  if(toSave.analysis && toSave.analysis.rawText && toSave.analysis.rawText.length>6000){
    toSave.analysis.rawText = toSave.analysis.rawText.slice(0,6000);
  }
  if(idx>=0) state.papers[idx]=toSave; else state.papers.push(toSave);
  savePapers();
}

      state.suggestTopicResults = Array.isArray(result) ? result : (result.questions||[]);
      render();
    }catch(err){
      toast(err.message || 'Could not fetch suggestions.', 'err');
    }
    btn.disabled = false;
  };

  document.querySelectorAll('[data-add-suggestion]').forEach(el=>{
    el.onclick = ()=>{
      const q = state.suggestTopicResults[parseInt(el.dataset.addSuggestion,10)];
      state.draft.questions.push({id:uid(), chapter:q.chapter, type:q.type, difficulty:q.difficulty, marks:Number(q.marks)||1, question:q.question, answerKey:q.answerKey||''});
      persistDraft(); render();
      toast('Question added to paper','ok');
    };
  });

  document.querySelectorAll('.qText,.qType,.qDiff,.qMarks,.qChapter').forEach(el=>{
    el.addEventListener('change', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      const field = el.dataset.field;
      let val = el.value;
      if(field==='marks') val = parseInt(val,10)||0;
      state.draft.questions[idx][field] = val;
      persistDraft();
    });
  });
  document.querySelectorAll('[data-remove-q]').forEach(el=>{
    el.onclick = ()=>{
      state.draft.questions.splice(parseInt(el.dataset.removeQ,10),1);
      persistDraft(); render();
    };
  });
  document.querySelectorAll('[data-toggle-answer]').forEach(el=>{
    el.onclick = ()=>{
      const box = document.getElementById('ans-'+el.dataset.toggleAnswer);
      box.classList.toggle('hidden');
      el.textContent = box.classList.contains('hidden') ? 'Show suggested answer' : 'Hide suggested answer';
    };
  });
  document.querySelectorAll('[data-regen]').forEach(el=>{
    el.onclick = async ()=>{
      const idx = parseInt(el.dataset.regen,10);
      const old = state.draft.questions[idx];
      el.innerHTML = '<span class="spin dark"></span>';
      try{
        const system = "You write a single replacement exam question. Respond with ONLY one valid JSON object, no markdown.";
        const prompt = `Write one replacement question for a ${state.draft.setup.subject} exam (${state.draft.setup.className}). It must be about "${old.chapter}", type "${old.type}", difficulty "${old.difficulty}", worth ${old.marks} marks. It must be clearly different from this existing question: "${old.question}". Return ONLY a JSON object with fields: chapter, type, marks, difficulty, question, answerKey.`;
        const q = await claudeJSON(system, prompt, 800);
        state.draft.questions[idx] = {id:old.id, chapter:q.chapter||old.chapter, type:q.type||old.type, difficulty:q.difficulty||old.difficulty, marks:Number(q.marks)||old.marks, question:q.question, answerKey:q.answerKey||''};
        persistDraft(); render();
      }catch(err){ toast(err.message || 'Could not regenerate.', 'err'); el.innerHTML='↻'; }
    };
  });

  document.getElementById('backStep1').onclick = ()=>{ state.wizardStep=1; render(); };
  document.getElementById('toStep3').onclick = ()=>{ state.wizardStep=3; render(); };
}

function attachStep3Events(){
  document.getElementById('backStep2').onclick = ()=>{ state.wizardStep=2; render(); };
  document.getElementById('toStep4').onclick = ()=>{ state.wizardStep=4; render(); };
}

function attachStep4Events(){
  document.getElementById('backStep3').onclick = ()=>{ state.wizardStep=3; render(); };
  document.getElementById('finalizeBtn').onclick = ()=>{
    state.draft.status = 'Final'; persistDraft(); render(); toast('Paper marked final','ok');
  };
  document.getElementById('saveDraftBtn2').onclick = ()=>{
    persistDraft(); state.draft = null; render(); toast('Saved','ok');
  };
  document.getElementById('exportPdfBtn').onclick = async (e)=>{
    const btn = e.currentTarget; btn.disabled = true;
    document.getElementById('pdfSpin').innerHTML = '<span class="spin"></span> ';
    try{
      const node = document.getElementById('sheetPreview');
      const canvas = await html2canvas(node, {scale:2, backgroundColor:'#ffffff'});
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','pt','a4');
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const imgW = pageW;
      const imgH = canvas.height * imgW / canvas.width;
      let heightLeft = imgH, position = 0;
      const imgData = canvas.toDataURL('image/png');
      pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
      heightLeft -= pageH;
      while(heightLeft > 0){
        position = heightLeft - imgH;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
        heightLeft -= pageH;
      }
      pdf.save((state.draft.setup.examName||'exam-paper').replace(/[^a-z0-9]+/gi,'-')+'.pdf');
    }catch(err){ toast('Could not export PDF: '+err.message, 'err'); }
    btn.disabled = false; document.getElementById('pdfSpin').innerHTML='';
  };
  document.getElementById('exportDocBtn').onclick = ()=>{
    const content = document.getElementById('sheetPreview').innerHTML;
    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset="utf-8"><title>${esc(state.draft.setup.examName||'Exam Paper')}</title>
    <style>body{font-family:Georgia,serif;} .marks{float:right;font-family:Arial,sans-serif;font-size:11px;} .instructions{font-family:Arial,sans-serif;font-size:11px;border:1px solid #ccc;padding:8px;} .section-h{font-weight:bold;margin-top:16px;}</style>
    </head><body>${content}</body></html>`;
    const blob = new Blob(['\ufeff', html], {type:'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (state.draft.setup.examName||'exam-paper').replace(/[^a-z0-9]+/gi,'-')+'.doc';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Word document downloaded','ok');
  };
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadAll();
  render();
})();
</script>
